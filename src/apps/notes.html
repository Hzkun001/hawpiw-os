<!doctype html>
<html>
<head>
<style>
  body{display:flex;flex-direction:column}
  textarea{flex:1;border:0;border-radius:0;resize:none;padding:12px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg)}
  textarea:focus-visible{outline:none}
</style>
</head>
<body>
  <div class="bar">
    <input id="path" class="grow" aria-label="Path file">
    <button id="save">Simpan</button>
    <span id="status" class="muted"></span>
  </div>
  <textarea id="text" spellcheck="false" placeholder="Tulis sesuatu…"></textarea>
<script>
  const $ = (id) => document.getElementById(id);
  let dirty = false;
  const status = (t, isErr) => { $('status').textContent = t; $('status').className = isErr ? 'err' : 'muted'; };

  async function load(path) {
    $('path').value = path;
    hawpiw.win.setTitle('Catatan — ' + path.split('/').pop());
    try { $('text').value = await hawpiw.fs.read(path); status(''); }
    catch { $('text').value = ''; status('file baru'); }
    dirty = false;
  }
  async function save() {
    try {
      await hawpiw.fs.write($('path').value, $('text').value);
      dirty = false;
      status('tersimpan');
      hawpiw.win.setTitle('Catatan — ' + $('path').value.split('/').pop());
    } catch (e) { status(e.message, true); }
  }
  $('save').onclick = save;
  $('text').oninput = () => { if (!dirty) { dirty = true; status('belum disimpan'); } };
  addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });
  load(hawpiw.args.path || '/home/catatan.txt');
</script>
</body>
</html>
